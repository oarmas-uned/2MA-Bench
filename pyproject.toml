[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twoma-bench"
version = "0.1.0"
description = "2M AI Bench (2MA-Bench) - The Frontier Procedural Hardness AI Benchmark"
readme = "README.md"
authors = [{ name = "2MA-Bench Core Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
2ma-bench = "twoma_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["twoma_bench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
